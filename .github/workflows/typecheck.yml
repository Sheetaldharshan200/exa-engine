name: typecheck

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run typecheck
        run: bun typecheck

      - name: Config schema is up to date
        run: |
          bun run --cwd packages/exa schema
          git diff --exit-code schema/config.json || {
            echo "::error::schema/config.json is stale — run 'bun run --cwd packages/exa schema' and commit"; exit 1; }
