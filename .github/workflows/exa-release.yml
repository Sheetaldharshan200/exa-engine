# Exa release — builds the CLI binaries for every platform from ONE runner
# (the build script cross-compiles via bun --target). The build script
# uploads upstream-named archives; the repackage step below replaces them
# with the exa-branded set (exa-darwin-arm64.zip, exa-linux-x64.tar.gz, ...)
# whose binary is named `exa` — the names Exasol Studio and install.sh use.
#
# Trigger: push a tag like v1.18.12-exa.1 (upstream version + our patch rev).
name: exa-release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14 # matches root package.json packageManager

      - name: Install dependencies
        run: bun install

      - name: Create the GitHub release (assets attach below)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "exa by Exasol — the Exa data agent CLI + engine. Install: curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/exa-main/install.sh | sh" \
            --repo "${GITHUB_REPOSITORY}" || true

      # Exasol Studio's web UI is the interface `exa web` serves, and it lives
      # in its own repository with its own toolchain. Build it here and hand
      # the output to the build script, so each exa release carries whatever
      # Studio was at that moment.
      #
      # REQUIRED, deliberately. It used to fall back to a second bundled UI
      # (packages/app); with that gone, a release without this step would ship
      # binaries with no web UI at all — a failed release that names the
      # missing token is strictly better than that shipping silently.
      - name: Build Exasol Studio's web UI
        id: studio
        env:
          STUDIO_REPO: ${{ vars.STUDIO_REPO || 'Sheetaldharshan200/Exasol-studio' }}
          STUDIO_REF: ${{ vars.STUDIO_REF || 'main' }}
          STUDIO_REPO_TOKEN: ${{ secrets.STUDIO_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${STUDIO_REPO_TOKEN:-}" ]; then
            echo "::error::STUDIO_REPO_TOKEN is not set. Add a fine-grained PAT with Contents:read on ${STUDIO_REPO} under Settings > Secrets and variables > Actions."
            exit 1
          fi
          git clone --depth 1 --branch "$STUDIO_REF" \
            "https://x-access-token:${STUDIO_REPO_TOKEN}@github.com/${STUDIO_REPO}.git" /tmp/studio
          corepack enable
          cd /tmp/studio
          pnpm install --frozen-lockfile
          pnpm --dir ./apps/desktop build
          # Prove the bundle is real before the binary is built around it: an
          # empty dist would embed a blank page and only be noticed at runtime.
          test -s /tmp/studio/apps/desktop/dist/index.html
          echo "dist=/tmp/studio/apps/desktop/dist" >> "$GITHUB_OUTPUT"
          echo "::notice::embedding Studio's web UI from ${STUDIO_REPO}@${STUDIO_REF}"

      # The documentation site (packages/web) is embedded into the binary and
      # served under /docs — `exa docs` opens it. The Studio notebook's source
      # of truth is the Studio repository (docs/site), synced from the clone
      # made above; the in-repo copy is the offline fallback.
      - name: Build documentation site
        run: |
          set -euo pipefail
          if [ -d /tmp/studio/docs/site ]; then
            rsync -a --delete /tmp/studio/docs/site/ packages/web/content/docs/studio/
            rm -f packages/web/content/docs/studio/README.md
            echo "::notice::Studio docs synced from the Studio repository"
          fi
          cd packages/web
          bun run build
          test -s out/exa.html

      - name: Build all targets and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # v1.18.12-exa.1 -> 1.18.12-exa.1 (build script prefixes the v)
          EXA_RELEASE: "1"
          EXA_WEB_UI_DIST: ${{ steps.studio.outputs.dist }}
        run: |
          export EXA_VERSION="${GITHUB_REF_NAME#v}"
          bun ./packages/exa/script/build.ts

      # npm/bun/pnpm installs: publish the exa-ai wrapper, its per-platform
      # binary packages, and the exa-engine-sdk / exa-engine-plugin libraries
      # (installed by consumers and by the runtime as @exa/* aliases).
      # Additive — the curl/irm installers work without it — so a missing
      # token skips with a notice rather than failing the release.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::notice::NPM_TOKEN is not set — skipping npm publish (curl/irm installs are unaffected)"
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          export EXA_VERSION="${GITHUB_REF_NAME#v}"
          bun ./packages/exa/script/publish.ts

      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # build.ts now emits exa-<os>-<arch> archives containing bin/exa
          # directly (package renamed exa -> exa), so no repackaging is
          # needed; just assert the release really carries exa-* assets.
          names=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' --repo "${GITHUB_REPOSITORY}")
          echo "$names"
          echo "$names" | grep -q '^exa-darwin-arm64\.zip$' || { echo "::error::exa-* assets missing"; exit 1; }
